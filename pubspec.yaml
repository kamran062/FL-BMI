name: bmi_health
description: BMI Calculator & Health — Know Your Body. Improve Your Health.
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  sqflite: ^2.3.3+1
  path: ^1.9.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  share_plus: ^10.1.2
  screenshot: ^3.0.0
  path_provider: ^2.1.4
  in_app_purchase: ^3.2.0
  google_mobile_ads: ^5.1.0
  flutter_svg: ^2.0.10+1
  package_info_plus: ^8.0.0
  go_router: ^17.0.0
  sentry_flutter: ^9.30.1
  video_player: ^2.10.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.1
  health: ^13.1.3
  geolocator: ^14.0.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.3.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#EBF8F1"
  adaptive_icon_foreground: "assets/icon_foreground.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    # Inter, bundled so text renders offline and no font requests go to
    # Google at runtime (privacy). OFL-licensed; see OFL.txt.
    - assets/google_fonts/
    - assets/exercises/

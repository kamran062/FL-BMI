# Runs on every push to main/develop and every pull request.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.29.2'

jobs:
  check:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Database tests run on sqflite_common_ffi, which needs the system SQLite
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get

      - name: Generated translations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- 'lib/l10n/app_localizations*.dart' || {
            echo "::error::lib/l10n is stale. Run 'make l10n' and commit the result."
            exit 1
          }

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  build-android:
    name: Build Android (dev)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Debug build: uses Google's test ad IDs, needs no secrets
      - run: flutter build apk --debug --flavor dev
      - name: Wear OS companion — unit tests and build
        working-directory: android
        run: ./gradlew :wear:testDevDebugUnitTest :wear:assembleDevDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 7

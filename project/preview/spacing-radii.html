<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Corner radii</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-canvas); height: 180px; box-sizing: border-box; display: flex; align-items: center; gap: 22px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 84px; height: 84px; background: var(--bg-surface); box-shadow: var(--elev-1); display: flex; align-items: center; justify-content: center; color: var(--fg-3); font: var(--t-overline); font-variant-numeric: tabular-nums; }
  .lbl { font: var(--t-caption); color: var(--fg-1); font-variant-numeric: tabular-nums; }
  .tok { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px; color: var(--fg-3); }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius:8px">8</div><span class="lbl">8 px</span><span class="tok">--r-xs</span></div>
  <div class="item"><div class="box" style="border-radius:12px">12</div><span class="lbl">12 px · chip</span><span class="tok">--r-sm</span></div>
  <div class="item"><div class="box" style="border-radius:14px">14</div><span class="lbl">14 px · button</span><span class="tok">--r-md</span></div>
  <div class="item"><div class="box" style="border-radius:20px">20</div><span class="lbl">20 px · card</span><span class="tok">--r-lg</span></div>
  <div class="item"><div class="box" style="border-radius:24px">24</div><span class="lbl">24 px · sheet</span><span class="tok">--r-xl</span></div>
  <div class="item"><div class="box" style="border-radius:9999px">∞</div><span class="lbl">pill</span><span class="tok">--r-pill</span></div>
</body>
</html>

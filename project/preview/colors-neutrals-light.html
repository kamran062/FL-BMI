<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Neutrals — light</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-canvas); height: 220px; box-sizing: border-box; display: flex; gap: 12px; }
  .col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .col h4 { margin: 0 0 4px; font: var(--t-overline); color: var(--fg-3); }
  .sw { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--r-sm); background: var(--bg-surface); box-shadow: var(--elev-1); }
  .chip { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(14,20,17,0.08); flex: none; }
  .tok { font: var(--t-caption); color: var(--fg-1); flex: 1; }
  .hex { font: var(--t-caption); color: var(--fg-3); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="col">
    <h4>Surfaces</h4>
    <div class="sw"><span class="chip" style="background:#FAFAF7"></span><span class="tok">bg-canvas</span><span class="hex">#FAFAF7</span></div>
    <div class="sw"><span class="chip" style="background:#FFFFFF"></span><span class="tok">bg-surface</span><span class="hex">#FFFFFF</span></div>
    <div class="sw"><span class="chip" style="background:#F1F2EE"></span><span class="tok">bg-sunken</span><span class="hex">#F1F2EE</span></div>
    <div class="sw"><span class="chip" style="background:#F4FBF7"></span><span class="tok">bg-tint</span><span class="hex">#F4FBF7</span></div>
  </div>
  <div class="col">
    <h4>Text</h4>
    <div class="sw"><span class="chip" style="background:#0E1411"></span><span class="tok">fg-1 — primary</span><span class="hex">#0E1411</span></div>
    <div class="sw"><span class="chip" style="background:#4A5450"></span><span class="tok">fg-2 — secondary</span><span class="hex">#4A5450</span></div>
    <div class="sw"><span class="chip" style="background:#8A938F"></span><span class="tok">fg-3 — tertiary</span><span class="hex">#8A938F</span></div>
    <div class="sw"><span class="chip" style="background:#FFFFFF"></span><span class="tok">fg-on-brand</span><span class="hex">#FFFFFF</span></div>
  </div>
  <div class="col">
    <h4>Borders</h4>
    <div class="sw"><span class="chip" style="background:rgba(14,20,17,0.10)"></span><span class="tok">border-subtle</span><span class="hex">10 % blk</span></div>
    <div class="sw"><span class="chip" style="background:rgba(14,20,17,0.06)"></span><span class="tok">border-faint</span><span class="hex">6 % blk</span></div>
    <div class="sw"><span class="chip" style="background:#0E1411;opacity:0.4"></span><span class="tok">bg-scrim</span><span class="hex">40 % ink</span></div>
  </div>
</body>
</html>

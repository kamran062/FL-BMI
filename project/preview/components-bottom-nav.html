<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bottom navigation</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-canvas); height: 220px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; }
  .frame { width: 390px; height: 80px; background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border-radius: var(--r-lg); box-shadow: var(--elev-2); border-top: 1px solid var(--border-faint); display: flex; align-items: stretch; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--fg-3); }
  .tab.active { color: var(--brand-500); }
  .tab .lbl { font: 600 11px/1 Inter; letter-spacing: 0.01em; }
  .ov { font: var(--t-overline); color: var(--fg-3); }
  .row { display: flex; align-items: center; gap: 20px; }
  .note { font: var(--t-caption); color: var(--fg-2); max-width: 240px; }
</style>
</head>
<body>
  <div class="ov">BOTTOM NAV · 64 PX · TRANSLUCENT</div>
  <div class="row">
    <div class="frame">
      <div class="tab active"><i data-lucide="calculator" width="22" height="22" stroke-width="2"></i><span class="lbl">Calculate</span></div>
      <div class="tab"><i data-lucide="line-chart" width="22" height="22" stroke-width="2"></i><span class="lbl">History</span></div>
      <div class="tab"><i data-lucide="lightbulb" width="22" height="22" stroke-width="2"></i><span class="lbl">Tips</span></div>
      <div class="tab"><i data-lucide="settings-2" width="22" height="22" stroke-width="2"></i><span class="lbl">Settings</span></div>
    </div>
    <span class="note">Translucent surface (85 % white + 12 px blur), 1 px hairline top border, active tab in brand-500, inactive in fg-3, no badges.</span>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Display type</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-canvas); height: 220px; box-sizing: border-box; display: flex; align-items: center; gap: 32px; }
  .num { font: 700 116px/0.95 var(--font-display); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; color: var(--fg-1); }
  .num .unit { font-size: 32px; font-weight: 500; color: var(--fg-3); margin-left: 6px; letter-spacing: -0.01em; }
  .meta { display: flex; flex-direction: column; gap: 8px; max-width: 280px; }
  .meta .ov { font: var(--t-overline); color: var(--fg-3); }
  .meta .lbl { font: var(--t-body-strong); color: var(--fg-1); }
  .meta .desc { font: var(--t-caption); color: var(--fg-2); }
  .tok { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; color: var(--fg-3); }
</style>
</head>
<body>
  <div class="num">26.4<span class="unit">kg/m²</span></div>
  <div class="meta">
    <span class="ov">DISPLAY · XL</span>
    <span class="lbl">Inter / 700 / 116 px</span>
    <span class="desc">Hero numerics. Tracking −0.04 em. Tabular nums on. Unit token at 32 px / 500 / fg-3.</span>
    <span class="tok">--t-display-xl</span>
  </div>
</body>
</html>

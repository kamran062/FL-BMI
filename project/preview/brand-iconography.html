<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: 22px 28px; background: var(--bg-canvas); height: 200px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; }
  .ov { font: var(--t-overline); color: var(--fg-3); }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 10px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; background: var(--bg-surface); border-radius: 12px; box-shadow: var(--elev-1); color: var(--fg-1); }
  .cell .lbl { font: 500 10px/1 Inter; color: var(--fg-3); }
  .note { font: var(--t-caption); color: var(--fg-2); }
</style>
</head>
<body>
  <div class="ov">LUCIDE · 1.75 PX STROKE · 24 PX GRID</div>
  <div class="grid">
    <div class="cell"><i data-lucide="calculator" width="22" height="22"></i><span class="lbl">calc</span></div>
    <div class="cell"><i data-lucide="line-chart" width="22" height="22"></i><span class="lbl">history</span></div>
    <div class="cell"><i data-lucide="lightbulb" width="22" height="22"></i><span class="lbl">tips</span></div>
    <div class="cell"><i data-lucide="settings-2" width="22" height="22"></i><span class="lbl">settings</span></div>
    <div class="cell"><i data-lucide="target" width="22" height="22"></i><span class="lbl">goal</span></div>
    <div class="cell"><i data-lucide="share" width="22" height="22"></i><span class="lbl">share</span></div>
    <div class="cell"><i data-lucide="bookmark" width="22" height="22"></i><span class="lbl">save</span></div>
    <div class="cell"><i data-lucide="sparkles" width="22" height="22"></i><span class="lbl">premium</span></div>
    <div class="cell"><i data-lucide="moon" width="22" height="22"></i><span class="lbl">dark</span></div>
    <div class="cell"><i data-lucide="ruler" width="22" height="22"></i><span class="lbl">units</span></div>
    <div class="cell"><i data-lucide="bell" width="22" height="22"></i><span class="lbl">notify</span></div>
    <div class="cell"><i data-lucide="chevron-right" width="22" height="22"></i><span class="lbl">chevron</span></div>
  </div>
  <span class="note">Substitute set — flag in <code style="font-family:ui-monospace;font-size:11px;background:var(--bg-sunken);padding:1px 5px;border-radius:4px">README.md</code> if a brand library is available.</span>
  <script>lucide.createIcons();</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>App icon</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px 28px; display: flex; align-items: center; gap: 28px; background: var(--bg-canvas); height: 200px; box-sizing: border-box; }
  .group { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .icon { box-shadow: var(--elev-2); border-radius: 30px; overflow: hidden; }
  .icon.sm { border-radius: 22px; }
  .icon.xs { border-radius: 16px; }
  .lbl { font: var(--t-caption); color: var(--fg-3); }
</style>
</head>
<body>
  <div class="group"><img src="../assets/app-icon.svg" alt="" width="128" height="128" class="icon" /><span class="lbl">128 px</span></div>
  <div class="group"><img src="../assets/app-icon.svg" alt="" width="88" height="88" class="icon sm" /><span class="lbl">88 px</span></div>
  <div class="group"><img src="../assets/app-icon.svg" alt="" width="64" height="64" class="icon xs" /><span class="lbl">64 px</span></div>
  <div class="group"><img src="../assets/app-icon.svg" alt="" width="40" height="40" class="icon xs" style="border-radius:10px" /><span class="lbl">40 px</span></div>
  <div class="group" style="margin-left:auto;align-items:flex-start;max-width:240px">
    <div style="font:var(--t-overline);color:var(--fg-2)">APP ICON</div>
    <div style="font:var(--t-body);color:var(--fg-1)">Soft mint gradient base, brand mark centered. 22 % corner radius on all sizes.</div>
  </div>
</body>
</html>

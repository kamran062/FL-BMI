<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 28px 28px; background: var(--bg-canvas); height: 200px; box-sizing: border-box; display: flex; align-items: center; gap: 28px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 110px; height: 80px; background: var(--bg-surface); border-radius: var(--r-lg); display: flex; align-items: center; justify-content: center; font: var(--t-overline); color: var(--fg-3); }
  .lbl { font: var(--t-caption); color: var(--fg-1); }
  .tok { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px; color: var(--fg-3); }
  .e1 { box-shadow: var(--elev-1); }
  .e2 { box-shadow: var(--elev-2); }
  .e3 { box-shadow: var(--elev-3); }
  .e4 { box-shadow: var(--elev-overlay); }
</style>
</head>
<body>
  <div class="item"><div class="box">FLAT</div><span class="lbl">No shadow</span><span class="tok">surfaces / sunken</span></div>
  <div class="item"><div class="box e1">elev-1</div><span class="lbl">Resting card</span><span class="tok">--elev-1</span></div>
  <div class="item"><div class="box e2">elev-2</div><span class="lbl">Floating / hover</span><span class="tok">--elev-2</span></div>
  <div class="item"><div class="box e3">elev-3</div><span class="lbl">Sheet / popover</span><span class="tok">--elev-3</span></div>
  <div class="item"><div class="box e4">overlay</div><span class="lbl">Modal</span><span class="tok">--elev-overlay</span></div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Brand colors</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-canvas); height: 200px; box-sizing: border-box; }
  .row { display: flex; gap: 12px; }
  .swatch { flex: 1; border-radius: var(--r-md); padding: 14px 14px 16px; display: flex; flex-direction: column; justify-content: space-between; min-height: 120px; box-shadow: var(--elev-1); }
  .swatch .name { font: var(--t-body-strong); }
  .swatch .hex { font: var(--t-caption); font-variant-numeric: tabular-nums; opacity: 0.7; }
  .swatch .tok { font: var(--t-overline); opacity: 0.55; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch" style="background:#E8F7EF;color:#0E1411"><span class="tok">BRAND · 100</span><div><div class="name">Mint tint</div><div class="hex">#E8F7EF</div></div></div>
    <div class="swatch" style="background:#8FE0BA;color:#0E1411"><span class="tok">BRAND · 300</span><div><div class="name">Mint</div><div class="hex">#8FE0BA</div></div></div>
    <div class="swatch" style="background:#1FB573;color:#FFFFFF"><span class="tok">BRAND · 500 ★</span><div><div class="name">Vital Green</div><div class="hex">#1FB573</div></div></div>
    <div class="swatch" style="background:#18A065;color:#FFFFFF"><span class="tok">BRAND · 600</span><div><div class="name">Pressed</div><div class="hex">#18A065</div></div></div>
    <div class="swatch" style="background:#128055;color:#FFFFFF"><span class="tok">BRAND · 700</span><div><div class="name">Deep</div><div class="hex">#128055</div></div></div>
  </div>
</body>
</html>

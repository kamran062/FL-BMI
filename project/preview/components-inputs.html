<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-canvas); height: 260px; box-sizing: border-box; display: flex; gap: 16px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .lbl { font: var(--t-caption); color: var(--fg-2); }
  .input { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; box-shadow: var(--elev-1); }
  .input input { border: none; outline: none; background: none; font: 500 17px/1 Inter; flex: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; color: var(--fg-1); }
  .input .unit { font: var(--t-caption); color: var(--fg-3); }
  .input.focus { border-color: var(--brand-500); box-shadow: 0 0 0 4px rgba(31,181,115,0.18), var(--elev-1); }
  .input.error { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(239,68,68,0.18); }
  .help { font: var(--t-caption); color: var(--fg-3); }
  .help.err { color: var(--danger); }
  .segmented { display: inline-flex; padding: 4px; background: var(--bg-sunken); border-radius: 12px; gap: 4px; }
  .seg { font: 600 13px/1 Inter; padding: 8px 14px; border-radius: 8px; color: var(--fg-2); cursor: pointer; }
  .seg.on { background: var(--bg-surface); color: var(--fg-1); box-shadow: var(--elev-1); }
</style>
</head>
<body>
  <div class="col">
    <div class="field">
      <span class="lbl">Height</span>
      <div class="input"><input value="172" /><span class="unit">cm</span></div>
    </div>
    <div class="field">
      <span class="lbl">Weight</span>
      <div class="input focus"><input value="78.4" /><span class="unit">kg</span></div>
      <span class="help">Focus state — 2 px brand ring</span>
    </div>
  </div>
  <div class="col">
    <div class="field">
      <span class="lbl">Age</span>
      <div class="input"><input placeholder="optional" /><span class="unit">years</span></div>
      <span class="help">Placeholder uses fg-3</span>
    </div>
    <div class="field">
      <span class="lbl">Weight</span>
      <div class="input error"><input value="450" /><span class="unit">kg</span></div>
      <span class="help err">Must be between 20 and 300 kg.</span>
    </div>
  </div>
  <div class="col" style="gap:18px">
    <div class="field">
      <span class="lbl">Units</span>
      <div class="segmented"><span class="seg on">cm</span><span class="seg">ft / in</span></div>
    </div>
    <div class="field">
      <span class="lbl">Gender</span>
      <div class="segmented"><span class="seg on">Female</span><span class="seg">Male</span><span class="seg">Other</span></div>
    </div>
  </div>
</body>
</html>

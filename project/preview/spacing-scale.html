<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-canvas); height: 200px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; }
  .scale { display: flex; align-items: flex-end; gap: 18px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--brand-300); border-radius: 4px; min-width: 8px; }
  .lbl { font: var(--t-overline); color: var(--fg-3); font-variant-numeric: tabular-nums; }
  .val { font: var(--t-caption); color: var(--fg-1); font-variant-numeric: tabular-nums; }
  .note { font: var(--t-caption); color: var(--fg-2); }
</style>
</head>
<body>
  <div class="note">4-px base grid. Use the smallest step that earns the separation.</div>
  <div class="scale">
    <div class="item"><div class="bar" style="width:4px;height:4px"></div><span class="val">4</span><span class="lbl">s-1</span></div>
    <div class="item"><div class="bar" style="width:8px;height:8px"></div><span class="val">8</span><span class="lbl">s-2</span></div>
    <div class="item"><div class="bar" style="width:12px;height:12px"></div><span class="val">12</span><span class="lbl">s-3</span></div>
    <div class="item"><div class="bar" style="width:16px;height:16px"></div><span class="val">16</span><span class="lbl">s-4</span></div>
    <div class="item"><div class="bar" style="width:20px;height:20px"></div><span class="val">20</span><span class="lbl">s-5</span></div>
    <div class="item"><div class="bar" style="width:24px;height:24px"></div><span class="val">24</span><span class="lbl">s-6</span></div>
    <div class="item"><div class="bar" style="width:32px;height:32px"></div><span class="val">32</span><span class="lbl">s-8</span></div>
    <div class="item"><div class="bar" style="width:40px;height:40px"></div><span class="val">40</span><span class="lbl">s-10</span></div>
    <div class="item"><div class="bar" style="width:48px;height:48px"></div><span class="val">48</span><span class="lbl">s-12</span></div>
    <div class="item"><div class="bar" style="width:64px;height:64px"></div><span class="val">64</span><span class="lbl">s-16</span></div>
  </div>
</body>
</html>
